# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build documentation in docs/source with Sphinx. Any warning (for example a
# module that autodoc cannot import, or a config key with no documentation)
# fails the build.
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# Install this repository with its "docs" extra (pyproject.toml), so the
# documentation is built against the code in the same commit.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
