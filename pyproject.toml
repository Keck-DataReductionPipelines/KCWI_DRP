[tool.poetry]
name = "kcwidrp"
version = "1.3.4"
description = "KCWI Data Reduction Pipeline"
readme = "README.rst"
license = "BSD-3-Clause"
authors = [
    "J. Neill <neill@srl.caltech.edu>",
    "L. Rizzi",
    "M. Brodheim"
]
homepage = "https://github.com/Keck-DataReductionPipelines/KCWI_DRP.git"
packages = [{ include = "kcwidrp" }]
include = [
    "kcwidrp/configs/*.cfg",
    "kcwidrp/data/*",
    "kcwidrp/data/extin/*",
    "kcwidrp/data/stds/*"
]

[tool.poetry.dependencies]
python = ">=3.12"
scikit-image = ">=0.24,<1.0"
astropy = ">=6.1.3,<6.2.0"
astroscrappy = ">=1.1.0,<1.2.0"
ccdproc = ">=2.4.2,<2.5.0"
numpy = "==1.26.4"
scipy = ">=1.14.1,<1.15.0"
pyerfa = ">=2.0.1.5,<3.0.0.0"
psutil = ">=5.7.0,<5.8.0"
keckdrpframework = "1.0"
requests = ">=2.32.5,<3.0.0"
pandas = ">=1.3.5,<3.0.0"
matplotlib = ">=3.9.2,<3.10.0"
tornado = ">=6.4,<7.0"
ref_index = ">=1.0,<2.0"
regions = ">=0.9,<1.0"
cython = ">=3.2.4,<4.0.0"
importlib_resources = "6.5.2"
# Test dependencies (D13): pip install -e ".[test]"
pytest = {version = ">=8", optional = true}
hypothesis = {version = ">=6.100", optional = true}
pytest-cov = {version = ">=5", optional = true}

[tool.poetry.extras]
test = ["pytest", "hypothesis", "pytest-cov"]

[tool.poetry.scripts]
reduce_kcwi = "kcwidrp.scripts.reduce_kcwi:main"
kcwi_masksky_ds9 = "kcwidrp.scripts.kcwi_masksky_ds9:main"
smart_reduce_kcwi = "kcwidrp.scripts.smart_reduce_kcwi:main"
modhead = "kcwidrp.scripts.modhead:main"
start_kcwi_rti = "kcwidrp.scripts.kcwi_rti:main"
wb = "kcwidrp.scripts.wb:wb_main"
wr = "kcwidrp.scripts.wr:wr_main"
check_cals = "kcwidrp.scripts.check_cals:main"

[tool.pytest.ini_options]
testpaths = ["kcwidrp/tests"]
# importlib import mode: test files need no __init__.py and same-named files
# in different directories (e.g. test_x.py in unit/core and unit/primitives)
# do not clash.
addopts = "--import-mode=importlib --strict-markers -m 'not regression and not viewer'"
markers = [
    "regression: needs $KCWI_REGRESSION_DATA; runs a full reduction (only in kcwidrp/tests/regression/)",
    "slow: a fast-suite test that takes more than 2 s (rare; the test says why)",
    "viewer: drives a live plot viewer through a fake browser tab (pytest -m viewer)",
]
filterwarnings = [
    # Ignore DeprecationWarning only where the warning is raised by a
    # third-party module, so deprecations raised from kcwidrp stay visible.
    # The list is the set actually emitted in the baseline env (T.1):
    # matplotlib 3.9 with pyparsing (PyparsingDeprecationWarning is a
    # DeprecationWarning subclass).
    "ignore::DeprecationWarning:matplotlib.*",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
